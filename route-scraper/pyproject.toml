[project]
name = "guide-to-pakistan-project"
version = "0.1.0"
description = "AI-powered Pakistan route, news & weather information system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.1",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "lxml>=6.1.1",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=5.0.2,<6.5",
    "celery[redis]>=5.6.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "google-genai>=2.11.0",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
